name: Build debug APK

on:
  push:
    branches:
      - main
      - stable-apk-signing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Android SDK platform 37.0
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'

      - name: Restore app signing key
        env:
          MY_NOTES_DEBUG_KEYSTORE: ${{ secrets.MY_NOTES_DEBUG_KEYSTORE }}
        run: |
          if [[ -z "$MY_NOTES_DEBUG_KEYSTORE" ]]; then
            echo "::error::Missing MY_NOTES_DEBUG_KEYSTORE repository secret."
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          umask 077
          printf '%s' "$MY_NOTES_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"


      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-notes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
